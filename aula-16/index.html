<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="estilo.css">

    <title>Minha Loja Online</title>
</head>

<body>

    <!-- CABEÇALHO -->

    <header class="header">

        <h1>Minha Loja Online</h1>

        <nav class="nav-menu">
            <ul>
                <li>
                    <a href="#">Home</a>
                </li>

                <li>
                    <a href="#produtos">Produtos</a>
                </li>

                <li>
                    <a href="#carrinho">Carrinho 🛒</a>
                </li>
            </ul>
        </nav>

    </header>


    <main>

        <!-- BANNER -->

        <section class="banner">

            <h2>Promoções Imperdíveis</h2>

            <p>
                Os melhores produtos com os melhores preços!
            </p>

        </section>


        <!-- PRODUTOS -->

        <section
            class="products-section"
            id="produtos">

            <h2>Nossos Produtos</h2>

            <div
                class="products"
                id="listaProdutos">

            </div>

        </section>


        <!-- CARRINHO -->

        <section
            class="cart-section"
            id="carrinho">

            <h2>🛒 Meu Carrinho</h2>

            <div
                id="areaCarrinho"
                class="cart">

            </div>


            <div class="cart-footer">

                <h3 id="elementoTotal">
                    Total: R$ 0.00
                </h3>

                <button
                    id="finalizarCompra"
                    class="btn-finalizar">

                    Finalizar compra

                </button>

            </div>

        </section>

    </main>


    <!-- RODAPÉ -->

    <footer class="footer">

        <p>
            &copy; 2026 Minha Loja Online
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
