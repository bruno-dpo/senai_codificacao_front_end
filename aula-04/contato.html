<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas práticas — Contato</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <header>
        <h1>Receitas práticas</h1>
        <p>Receitas e lanches simples</p>

        <nav aria-label="Menu principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="galeria.html">Galeria</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contato">
            <h2>Contato</h2>
            <p>Envie sua mensagem, dúvida ou sugestão de receita. Responderemos o mais breve possível.</p>

            <form action="#" method="post">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto" required>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

                <button type="submit" class="botao">Enviar mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Feito por: Bruno Henrique e Wolfegan Lemos</p>
        <a href="https://www.tudogostoso.com.br/receita/306823-brownie-simples-e-rapido.html" target="_blank"
            rel="noopener noreferrer">Visite nossos parceiros</a>
    </footer>
</body>

</html>
